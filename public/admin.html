<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 패널 - 한국어 수업 관리</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; }
    body { background: #f1f5f9; color: #1e293b; min-height: 100vh; }
    button { cursor: pointer; font-family: inherit; }

    .topbar { background: #001f5c; color: white; position: sticky; top: 0; z-index: 50; }
    .topbar-inner { max-width: 1150px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand .logo { font-size: 24px; }
    .brand b { font-size: 15px; display: block; line-height: 1.3; }
    .brand small { font-size: 11px; color: rgba(255,255,255,0.6); }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .top-actions .uname { font-size: 13px; color: rgba(255,255,255,0.85); margin-right: 6px; }
    .btn-ghost { background: rgba(255,255,255,0.12); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; }
    .btn-ghost:hover { background: rgba(255,255,255,0.22); }

    main { max-width: 1150px; margin: 0 auto; padding: 24px 20px 60px; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px 20px; }
    .stat .num { font-size: 26px; font-weight: 800; color: #001f5c; }
    .stat .lbl { font-size: 13px; color: #64748b; margin-top: 2px; }

    .section-head { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 14px; }
    .section-head h2 { font-size: 19px; color: #001f5c; }
    .btn-primary { background: #003087; color: white; border: none; padding: 10px 18px; border-radius: 9px; font-size: 14px; font-weight: 600; }
    .btn-primary:hover { background: #1a4aa0; }

    .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .gcard { background: white; border: 1px solid #e2e8f0; border-radius: 14px; padding: 18px 20px; }
    .gcard-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .gcard h3 { font-size: 17px; color: #1e293b; }
    .gcard .meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 14px; }
    .chip { font-size: 12.5px; padding: 4px 11px; border-radius: 999px; background: #f1f5f9; color: #334155; }
    .chip.day { background: #e6f1fb; color: #185fa5; font-weight: 700; }
    .chip.cnt { background: #e1f5ee; color: #0f6e56; font-weight: 700; }
    .gcard-btns { display: flex; flex-wrap: wrap; gap: 7px; }
    .btn-sm { border: 1px solid #e2e8f0; background: white; padding: 7px 12px; border-radius: 8px; font-size: 12.5px; color: #334155; }
    .btn-sm:hover { background: #f8fafc; border-color: #cbd5e1; }
    .btn-sm.excel { background: #0f6e56; border-color: #0f6e56; color: white; }
    .btn-sm.excel:hover { background: #085041; }
    .btn-sm.excel-full { background: #1a4aa0; border-color: #1a4aa0; color: white; }
    .btn-sm.excel-full:hover { background: #123a80; }
    .btn-sm.danger { color: #dc2626; }
    .btn-sm.danger:hover { background: #fef2f2; border-color: #fca5a5; }

    .empty { background: white; border: 1px dashed #cbd5e1; border-radius: 14px; padding: 40px; text-align: center; color: #64748b; font-size: 14px; }

    /* Student panel */
    .students-panel { background: white; border: 1px solid #e2e8f0; border-radius: 14px; margin-top: 24px; overflow: hidden; display: none; }
    .students-head { background: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .students-head h3 { font-size: 16px; color: #001f5c; }
    .students-panel table { width: 100%; border-collapse: collapse; }
    .students-panel th { text-align: left; font-size: 12.5px; color: #64748b; padding: 10px 20px; border-bottom: 1px solid #f1f5f9; font-weight: 600; }
    .students-panel td { padding: 11px 20px; font-size: 14px; border-bottom: 1px solid #f8fafc; }
    .students-panel tr:hover td { background: #f8fafc; }
    .row-actions { display: flex; gap: 6px; justify-content: flex-end; }

    /* Modal */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.55); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
    .overlay.open { display: flex; }
    .modal { background: white; border-radius: 16px; width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; }
    .modal-head { padding: 18px 24px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    .modal-head h3 { font-size: 17px; color: #001f5c; }
    .modal-close { border: none; background: none; font-size: 20px; color: #94a3b8; }
    .modal-body { padding: 20px 24px 24px; }
    .fg { margin-bottom: 14px; }
    .fg label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 5px; }
    .fg input, .fg select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; font-family: inherit; }
    .fg input:focus, .fg select:focus { outline: none; border-color: #003087; box-shadow: 0 0 0 3px rgba(0,48,135,0.1); }
    .modal .btn-primary { width: 100%; padding: 12px; margin-top: 4px; }
    .hint { font-size: 12px; color: #94a3b8; margin-top: 4px; }

    .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 11px 22px; border-radius: 10px; font-size: 14px; z-index: 200; display: none; }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="logo">🇰🇷</span>
      <div>
        <b>울산 외국인 근로자 지원센터</b>
        <small>한국어 수업 관리</small>
      </div>
    </div>
    <div class="top-actions">
      <span class="uname" id="uname"></span>
      <button class="btn-ghost" onclick="openPwModal()">🔑 비밀번호</button>
      <button class="btn-ghost" onclick="logout()">🚪 로그아웃</button>
    </div>
  </div>
</header>

<main>
  <div class="stats">
    <div class="stat"><div class="num" id="statGroups">-</div><div class="lbl">반 (그룹)</div></div>
    <div class="stat"><div class="num" id="statStudents">-</div><div class="lbl">전체 학생</div></div>
  </div>

  <div class="section-head">
    <h2>📚 반 목록</h2>
    <button class="btn-primary" onclick="openGroupModal()">+ 반 추가</button>
  </div>

  <div class="groups" id="groupList"></div>
  <div class="empty" id="groupsEmpty" style="display:none">아직 등록된 반이 없습니다. "반 추가" 버튼으로 첫 반을 만들어 보세요.</div>

  <div class="students-panel" id="studentsPanel">
    <div class="students-head">
      <h3 id="studentsTitle">학생 명단</h3>
      <div style="display:flex;gap:8px">
        <button class="btn-sm excel" onclick="downloadExcel(currentGroupId)">⬇ Excel 다운로드</button>
        <button class="btn-sm excel-full" onclick="downloadExcelFull(currentGroupId)">⬇ 전체정보 Excel</button>
        <button class="btn-sm" onclick="openStudentModal()">+ 학생 추가</button>
        <button class="btn-sm" onclick="closeStudents()">✕ 닫기</button>
      </div>
    </div>
    <table>
      <thead><tr><th style="width:60px">번호</th><th>이름</th><th style="width:160px; text-align:right">관리</th></tr></thead>
      <tbody id="studentRows"></tbody>
    </table>
  </div>
</main>

<!-- Group modal -->
<div class="overlay" id="groupModal">
  <div class="modal">
    <div class="modal-head"><h3 id="groupModalTitle">반 추가</h3><button class="modal-close" onclick="closeModal('groupModal')">✕</button></div>
    <div class="modal-body">
      <div class="fg"><label>반 이름 *</label><input id="gName" placeholder="예: 초급 1반"></div>
      <div class="fg"><label>요일</label>
        <select id="gDay">
          <option value="">선택 안 함</option>
          <option>월요일</option><option>화요일</option><option>수요일</option>
          <option>목요일</option><option>금요일</option><option>토요일</option><option>일요일</option>
        </select>
      </div>
      <div class="fg"><label>수업 시간</label><input id="gTime" placeholder="예: 10:00 - 12:00"></div>
      <div class="fg"><label>담당 선생님</label><input id="gTeacher" placeholder="예: 김선생님"></div>
      <button class="btn-primary" onclick="saveGroup()">저장</button>
    </div>
  </div>
</div>

<!-- Student modal -->
<div class="overlay" id="studentModal">
  <div class="modal">
    <div class="modal-head"><h3 id="studentModalTitle">학생 추가</h3><button class="modal-close" onclick="closeModal('studentModal')">✕</button></div>
    <div class="modal-body">
      <div class="fg"><label>이름 *</label><input id="sName" placeholder="예: Aziz Karimov"></div>
      <div class="fg"><label>성별</label>
        <select id="sGender"><option value="">선택 안 함</option><option value="남">남</option><option value="여">여</option></select>
      </div>
      <div class="fg"><label>비자</label><input id="sVisa" placeholder="예: E-9"></div>
      <div class="fg"><label>국적</label><input id="sNat" placeholder="예: 우즈베키스탄"></div>
      <div class="fg"><label>전화번호</label><input id="sPhone" placeholder="예: 010-1234-5678"></div>
      <div class="fg"><label>주소</label><input id="sAddr" placeholder="예: 울산시 남구"></div>
      <div class="fg"><label>반</label><select id="sGroup"></select></div>
      <button class="btn-primary" onclick="saveStudent()">저장</button>
    </div>
  </div>
</div>

<!-- Password modal -->
<div class="overlay" id="pwModal">
  <div class="modal">
    <div class="modal-head"><h3>비밀번호 변경</h3><button class="modal-close" onclick="closeModal('pwModal')">✕</button></div>
    <div class="modal-body">
      <div class="fg"><label>현재 비밀번호</label><input type="password" id="pwCur"></div>
      <div class="fg"><label>새 비밀번호</label><input type="password" id="pwNew"><div class="hint">6자 이상</div></div>
      <button class="btn-primary" onclick="changePw()">변경</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const token = localStorage.getItem('token');
if (!token) window.location.href = 'login.html';
document.getElementById('uname').textContent = localStorage.getItem('name') || '';

let groups = [];
let currentGroupId = null;
let currentStudents = [];
let editingGroupId = null;
let editingStudentId = null;

const H = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };

async function api(url, opts = {}) {
  const res = await fetch(url, { headers: H, ...opts });
  if (res.status === 401) { localStorage.clear(); window.location.href = 'login.html'; return null; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { toast(data.error || '오류가 발생했습니다'); return null; }
  return data;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2600);
}

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

// ---- Load groups ----
async function loadGroups() {
  const data = await api('/api/groups');
  if (!data) return;
  groups = data;
  const total = groups.reduce((a, g) => a + g.studentCount, 0);
  document.getElementById('statGroups').textContent = groups.length;
  document.getElementById('statStudents').textContent = total;

  const list = document.getElementById('groupList');
  document.getElementById('groupsEmpty').style.display = groups.length ? 'none' : 'block';
  list.innerHTML = groups.map(g => `
    <div class="gcard">
      <div class="gcard-top">
        <h3>${esc(g.name)}</h3>
      </div>
      <div class="meta">
        ${g.day_of_week ? `<span class="chip day">📅 ${esc(g.day_of_week)}</span>` : ''}
        ${g.class_time ? `<span class="chip">🕐 ${esc(g.class_time)}</span>` : ''}
        ${g.teacher_name ? `<span class="chip">👩‍🏫 ${esc(g.teacher_name)}</span>` : ''}
        <span class="chip cnt">👨‍🎓 학생 ${g.studentCount}명</span>
      </div>
      <div class="gcard-btns">
        <button class="btn-sm" onclick="openStudents('${g.id}')">👥 명단 보기</button>
        <button class="btn-sm excel" onclick="downloadExcel('${g.id}')">⬇ Excel</button>
        <button class="btn-sm excel-full" onclick="downloadExcelFull('${g.id}')">⬇ 전체정보</button>
        <button class="btn-sm" onclick="openGroupModal('${g.id}')">✏ 수정</button>
        <button class="btn-sm danger" onclick="deleteGroup('${g.id}')">🗑</button>
      </div>
    </div>`).join('');
}

// ---- Group modal ----
function openGroupModal(id) {
  editingGroupId = id || null;
  document.getElementById('groupModalTitle').textContent = id ? '반 수정' : '반 추가';
  const g = groups.find(x => x.id === id) || {};
  document.getElementById('gName').value = g.name || '';
  document.getElementById('gDay').value = g.day_of_week || '';
  document.getElementById('gTime').value = g.class_time || '';
  document.getElementById('gTeacher').value = g.teacher_name || '';
  document.getElementById('groupModal').classList.add('open');
}

async function saveGroup() {
  const body = JSON.stringify({
    name: document.getElementById('gName').value.trim(),
    day_of_week: document.getElementById('gDay').value,
    class_time: document.getElementById('gTime').value.trim(),
    teacher_name: document.getElementById('gTeacher').value.trim()
  });
  const r = editingGroupId
    ? await api('/api/groups/' + editingGroupId, { method: 'PUT', body })
    : await api('/api/groups', { method: 'POST', body });
  if (r) { closeModal('groupModal'); toast('저장되었습니다'); loadGroups(); }
}

async function deleteGroup(id) {
  const g = groups.find(x => x.id === id);
  if (!confirm(`'${g.name}' 반을 삭제하시겠습니까?\n(학생 정보는 삭제되지 않고 미배정 상태가 됩니다)`)) return;
  const r = await api('/api/groups/' + id, { method: 'DELETE' });
  if (r) { toast('삭제되었습니다'); closeStudents(); loadGroups(); }
}

// ---- Students ----
async function openStudents(groupId) {
  currentGroupId = groupId;
  const g = groups.find(x => x.id === groupId);
  const data = await api('/api/students?group_id=' + groupId);
  if (!data) return;
  currentStudents = data;
  document.getElementById('studentsTitle').textContent = `${g.name} — 학생 명단 (${data.length}명)`;
  document.getElementById('studentRows').innerHTML = data.length
    ? data.map((s, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${esc(s.name)}</td>
        <td><div class="row-actions">
          <button class="btn-sm" onclick="openStudentModal('${s.id}')">✏ 수정</button>
          <button class="btn-sm danger" onclick="deleteStudent('${s.id}')">🗑</button>
        </div></td>
      </tr>`).join('')
    : '<tr><td colspan="3" style="text-align:center;color:#94a3b8;padding:24px">등록된 학생이 없습니다</td></tr>';
  const panel = document.getElementById('studentsPanel');
  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeStudents() {
  currentGroupId = null;
  document.getElementById('studentsPanel').style.display = 'none';
}

function openStudentModal(id) {
  editingStudentId = id || null;
  document.getElementById('studentModalTitle').textContent = id ? '학생 정보 수정' : '학생 추가';
  const sel = document.getElementById('sGroup');
  sel.innerHTML = '<option value="">미배정</option>' + groups.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('');
  const s = currentStudents.find(x => x.id === id) || {};
  document.getElementById('sName').value = s.name || '';
  document.getElementById('sGender').value = s.gender || '';
  document.getElementById('sVisa').value = s.visa_type || '';
  document.getElementById('sNat').value = s.nationality || '';
  document.getElementById('sPhone').value = s.phone || '';
  document.getElementById('sAddr').value = s.address || '';
  sel.value = s.group_id || currentGroupId || '';
  document.getElementById('studentModal').classList.add('open');
}

async function saveStudent() {
  const body = JSON.stringify({
    name: document.getElementById('sName').value.trim(),
    gender: document.getElementById('sGender').value,
    visa_type: document.getElementById('sVisa').value.trim(),
    nationality: document.getElementById('sNat').value.trim(),
    phone: document.getElementById('sPhone').value.trim(),
    address: document.getElementById('sAddr').value.trim(),
    group_id: document.getElementById('sGroup').value || null
  });
  const r = editingStudentId
    ? await api('/api/students/' + editingStudentId, { method: 'PUT', body })
    : await api('/api/students', { method: 'POST', body });
  if (r) {
    closeModal('studentModal'); toast('저장되었습니다');
    await loadGroups();
    if (currentGroupId) openStudents(currentGroupId);
  }
}

async function deleteStudent(id) {
  const s = currentStudents.find(x => x.id === id);
  if (!confirm(`'${s.name}' 학생을 삭제하시겠습니까?`)) return;
  const r = await api('/api/students/' + id, { method: 'DELETE' });
  if (r) { toast('삭제되었습니다'); await loadGroups(); if (currentGroupId) openStudents(currentGroupId); }
}

// ---- Excel ----
async function downloadExcel(groupId) {
  const g = groups.find(x => x.id === groupId);
  if (!g) return;
  const data = await api('/api/students?group_id=' + groupId);
  if (!data) return;
  if (!data.length) { toast('이 반에는 학생이 없습니다'); return; }
  const rows = [['번호', '이름'], ...data.map((s, i) => [i + 1, s.name])];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 6 }, { wch: 28 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '학생 명단');
  const safe = g.name.replace(/[\\/:*?"<>|]/g, '_');
  XLSX.writeFile(wb, `${safe}_학생명단.xlsx`);
}

// ---- Excel (전체 정보) ----
async function downloadExcelFull(groupId) {
  const g = groups.find(x => x.id === groupId);
  if (!g) return;
  const data = await api('/api/students?group_id=' + groupId);
  if (!data) return;
  if (!data.length) { toast('이 반에는 학생이 없습니다'); return; }
  const header = ['번호', '이름', '성별', '비자', '국적', '전화번호', '주소', '반'];
  const rows = [header, ...data.map((s, i) => [
    i + 1,
    s.name || '',
    s.gender || '',
    s.visa_type || '',
    s.nationality || '',
    s.phone || '',
    s.address || '',
    g.name || ''
  ])];
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [
    { wch: 6 }, { wch: 22 }, { wch: 8 }, { wch: 10 },
    { wch: 14 }, { wch: 16 }, { wch: 32 }, { wch: 14 }
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '학생 전체정보');
  const safe = g.name.replace(/[\\/:*?"<>|]/g, '_');
  XLSX.writeFile(wb, `${safe}_학생전체정보.xlsx`);
}

// ---- Password ----
function openPwModal() {
  document.getElementById('pwCur').value = '';
  document.getElementById('pwNew').value = '';
  document.getElementById('pwModal').classList.add('open');
}

async function changePw() {
  const r = await api('/api/password', {
    method: 'PUT',
    body: JSON.stringify({
      currentPassword: document.getElementById('pwCur').value,
      newPassword: document.getElementById('pwNew').value
    })
  });
  if (r) { closeModal('pwModal'); toast('비밀번호가 변경되었습니다'); }
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); }));

function logout() { localStorage.clear(); window.location.href = 'login.html'; }

loadGroups();
</script>
</body>
</html>
